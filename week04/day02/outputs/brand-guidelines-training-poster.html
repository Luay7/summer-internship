<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Week 4 — Claude Skills</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #141413;
    --light: #faf9f5;
    --mid-gray: #b0aea5;
    --light-gray: #e8e6dc;
    --orange: #d97757;
    --blue: #6a9bcc;
    --green: #788c5d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--light-gray);
    font-family: 'Lora', Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .poster {
    width: 850px;
    background: var(--light);
    border: 1px solid var(--light-gray);
    box-shadow: 0 10px 40px rgba(20,20,19,0.12);
    position: relative;
    overflow: hidden;
  }
  .header {
    background: var(--dark);
    color: var(--light);
    padding: 48px 56px 40px 56px;
    position: relative;
  }
  .eyebrow {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 46px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  .subtitle {
    font-family: 'Lora', Georgia, serif;
    font-size: 18px;
    font-style: italic;
    color: var(--mid-gray);
  }
  .header-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    display: flex;
    width: 100%;
    height: 8px;
  }
  .header-bar span { flex: 1; }
  .header-bar .o { background: var(--orange); }
  .header-bar .b { background: var(--blue); }
  .header-bar .g { background: var(--green); }
  .content { padding: 44px 56px 48px 56px; }
  .section-label {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--mid-gray);
    margin-bottom: 24px;
  }
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .task {
    display: flex;
    align-items: center;
    background: var(--light);
    border: 1px solid var(--light-gray);
    border-left: 6px solid var(--orange);
    border-radius: 6px;
    padding: 20px 26px;
  }
  .task:nth-child(2) { border-left-color: var(--blue); }
  .task:nth-child(3) { border-left-color: var(--green); }
  .task:nth-child(4) { border-left-color: var(--orange); }
  .task:nth-child(5) { border-left-color: var(--blue); }
  .task-num {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: var(--dark);
    width: 78px;
    flex-shrink: 0;
  }
  .task-divider {
    width: 1px;
    height: 34px;
    background: var(--light-gray);
    margin-right: 24px;
    flex-shrink: 0;
  }
  .task-text {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--dark);
  }
  .footer {
    background: var(--light-gray);
    padding: 22px 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-label {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--dark);
  }
  .dots { display: flex; gap: 8px; }
  .dots span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }
  .dots .o { background: var(--orange); }
  .dots .b { background: var(--blue); }
  .dots .g { background: var(--green); }
</style>
</head>
<body>
<div class="poster">
  <div class="header">
    <div class="eyebrow">Internal Training · Week 4</div>
    <h1>Claude Skills</h1>
    <div class="subtitle">Weekly Training Topics</div>
    <div class="header-bar">
      <span class="o"></span><span class="b"></span><span class="g"></span>
    </div>
  </div>
  <div class="content">
    <div class="section-label">This Week's Curriculum</div>
    <div class="task-list">
      <div class="task"><div class="task-num">01</div><div class="task-divider"></div><div class="task-text">What is a skill</div></div>
      <div class="task"><div class="task-num">02</div><div class="task-divider"></div><div class="task-text">Using existing skills</div></div>
      <div class="task"><div class="task-num">03</div><div class="task-divider"></div><div class="task-text">The SKILL.md structure</div></div>
      <div class="task"><div class="task-num">04</div><div class="task-divider"></div><div class="task-text">Build your own skill</div></div>
      <div class="task"><div class="task-num">05</div><div class="task-divider"></div><div class="task-text">Test &amp; chain skills</div></div>
    </div>
  </div>
  <div class="footer">
    <div class="footer-label">Anthropic · Internal Training Series</div>
    <div class="dots">
      <span class="o"></span><span class="b"></span><span class="g"></span>
    </div>
  </div>
</div>
</body>
</html>
